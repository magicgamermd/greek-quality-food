id: 08-waybill-button-file
title: Товарителница през inline бутон → PDF файл в чата
category: econt
persona: warehouse-manager
goal: |
  Издай фактура за последната confirmed поръчка (или за #1 ако няма).
  Когато бот-ът прикачи фактурата с inline бутони, натисни бутон
  "Товарителница". Попълни нужните данни (адрес на получателя:
  "Бургас, ул. Цар Симеон 12"; тегло 3 кг) и завърши когато получиш
  PDF файл на товарителницата.
success_criteria:
  - Бот-ът показва inline бутон с текст "Товарителница"
  - След натискане на бутона ботът предприема действие (не игнорира)
  - Накрая в чата пристига файл (PDF) на товарителницата
  - Файлът има смислено име (tovaritelnica-* или waybill-*)
forbidden_behaviors:
  - Бутонът да не прави нищо (silent no-op)
  - Повторно въвеждане на данни, които са вече известни (адрес на подателя)
  - Да поиска да пишеш "товарителница" в чата вместо да използва бутона
max_turns: 16
tags: [critical-path, destructive, attachments, buttons]
