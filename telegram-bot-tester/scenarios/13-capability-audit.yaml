id: 13-capability-audit
title: Какви справки/действия може бот-ът — capability audit
category: inventory
persona: new-employee
goal: |
  Питай бот-а какво може да прави. След това попитай конкретно за:
  "какви справки правиш?", "мога ли да видя наличности?",
  "мога ли да видя продажби?", "мога ли да добавям стока?".
  Успех е когато получиш ясна листа какво ботът ПРАВИ и какво НЕ
  може (четене vs писане). Не приемай мъгляви "да, разбира се"
  отговори — искам конкретика.
success_criteria:
  - Бот-ът изброява основните справки които може да прави (наличности,
    поръчки, фактури и/или цена/продажби)
  - Бот-ът изрично споменава поне едно нещо което НЕ може (напр.
    добавяне/махане на стока, изтриване на артикули)
  - Отговорите са конкретни, не general "мога да помогна с всичко"
forbidden_behaviors:
  - Отговор "мога всичко свързано с управлението" без детайли
  - Изреждане на действия които всъщност не работят (hallucination)
  - Мълчание за ограниченията
max_turns: 10
tags: [discovery, capability]
