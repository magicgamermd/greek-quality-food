id: 07-individual-invoice-file
title: Поръчка за физическо лице → фактура като PDF файл
category: invoices
persona: warehouse-manager
goal: |
  Създай поръчка за физическо лице (не фирма) на име
  "Иван Петров Димитров", ЕГН да не се изисква, телефон 0888123456,
  с 1 брой артикул HD-42. Поискай фактура в чата. Завърши когато
  видиш прикачен PDF файл на фактурата.
success_criteria:
  - Ботът разпознава че това е физическо лице, не фирма
  - Поръчката е създадена и има номер
  - Фактурата е издадена и пристига като PDF файл в чата
  - Името на файла съдържа номер на фактурата
forbidden_behaviors:
  - Да изисква ЕИК от физическо лице
  - Да изисква ЕГН (не е нужен за проформа/фактура до определена сума)
  - Да откаже да работи с частно лице
max_turns: 14
tags: [critical-path, destructive, attachments]
