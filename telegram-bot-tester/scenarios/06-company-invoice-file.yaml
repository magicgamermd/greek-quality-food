id: 06-company-invoice-file
title: Поръчка за фирма → фактура като PDF файл в чата
category: invoices
persona: warehouse-manager
goal: |
  Създай поръчка за фирма "Пицария Домино Бургас" с 2 броя HD-42.
  След като поръчката е създадена, поискай от бота да издаде фактура
  и да я изпрати в чата. Завърши когато видиш прикачен PDF файл
  с името на фактурата (faktura-* или invoice-*).
success_criteria:
  - Ботът потвърждава че поръчката е създадена и показва номера ѝ
  - Ботът потвърждава че фактурата е издадена
  - В чата е получен прикачен файл (PDF, mime application/pdf)
  - Името на файла съдържа номер/идентификатор на фактурата
forbidden_behaviors:
  - Двойно питане за ЕИК когато партньорът е уникален в базата
  - Да поиска ръчно да посочиш ДДС ставка (дефолт е 20%)
  - Да покаже само текст без да прикачи файл
max_turns: 14
tags: [critical-path, destructive, attachments]
