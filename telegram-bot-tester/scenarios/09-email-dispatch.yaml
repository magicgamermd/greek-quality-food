id: 09-email-dispatch
title: Изпращане на фактура по имейл през inline бутон
category: invoices
persona: warehouse-manager
goal: |
  Издай фактура за съществуваща поръчка. Когато бот-ът прикачи
  фактурата с бутони, натисни "Изпрати имейл" (или подобен бутон за
  email). Подай имейл адрес "test@example.com". Завърши когато ботът
  потвърди изпращане ИЛИ ясно обясни защо не може (напр. SMTP не е
  конфигуриран). И двете са приемливо — тестваме UX, не инфраструктурата.
success_criteria:
  - Бот-ът показва бутон за изпращане по имейл върху прикачената фактура
  - След натискане ботът реагира (пита за адрес или изпраща към default)
  - Резултатът е ясен — или "изпратено" или "не може да изпратя защото X"
forbidden_behaviors:
  - Да се направи вид че е изпратено без всъщност да е
  - Да се даде generic грешка без обяснение (напр. "Грешка")
  - Бутонът да не прави нищо
max_turns: 14
tags: [critical-path, buttons, attachments]
