<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    background: #0a0a14;
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    color: #ffffff;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Background gradient */
  .bg-gradient {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 400px 400px at 50% 20%, rgba(99,102,241,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 300px 300px at 80% 80%, rgba(139,92,246,0.05) 0%, transparent 70%),
                #0a0a14;
  }

  /* Subtle grid pattern */
  .bg-gradient::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .status-bar {
    height: 54px;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 8px;
    font-size: 15px;
    font-weight: 600;
    position: relative;
    z-index: 1;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  .login-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 32px 60px;
    width: 100%;
    position: relative;
    z-index: 1;
  }

  /* Logo */
  .logo-wrap {
    margin-bottom: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .logo-circle {
    width: 80px; height: 80px;
    border-radius: 24px;
    background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #818cf8 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(99,102,241,0.4), 0 2px 8px rgba(99,102,241,0.2);
    position: relative;
  }
  .logo-circle::after {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 23px;
    background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
  }
  .logo-text {
    text-align: center;
  }
  .app-title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #ffffff;
    margin-bottom: 6px;
  }
  .app-subtitle {
    font-size: 14px;
    color: #6b7280;
    font-weight: 500;
    letter-spacing: -0.1px;
  }

  /* Form */
  .form-group {
    width: 100%;
    margin-bottom: 12px;
  }
  .form-label {
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    display: block;
    padding-left: 2px;
  }
  .form-input {
    width: 100%;
    background: #12121e;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .form-input.focused {
    border-color: rgba(99,102,241,0.4);
    background: #141420;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
  }
  .input-text {
    font-size: 16px;
    color: #4b5563;
    flex: 1;
    letter-spacing: -0.2px;
  }
  .input-text.filled {
    color: #e5e7eb;
    font-weight: 500;
  }
  .input-icon { flex-shrink: 0; }

  /* Remember me */
  .remember-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    margin-top: 6px;
    padding: 0 2px;
  }
  .remember-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .remember-text {
    font-size: 14px;
    color: #6b7280;
    font-weight: 500;
  }
  /* Toggle switch */
  .toggle {
    width: 44px; height: 26px;
    background: rgba(99,102,241,0.3);
    border-radius: 13px;
    position: relative;
    border: 1px solid rgba(99,102,241,0.2);
  }
  .toggle-knob {
    width: 20px; height: 20px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 2px; left: 2px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .forgot-link {
    font-size: 13px;
    color: #6366f1;
    font-weight: 500;
  }

  /* Login button */
  .login-btn {
    width: 100%;
    background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    color: white;
    letter-spacing: -0.2px;
    box-shadow: 0 4px 20px rgba(99,102,241,0.4), 0 1px 3px rgba(99,102,241,0.2);
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .login-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 100%);
    border-radius: 16px 16px 0 0;
  }

  /* Footer */
  .footer-text {
    font-size: 12px;
    color: #374151;
    text-align: center;
    line-height: 1.5;
  }
  .footer-text a {
    color: #6366f1;
    text-decoration: none;
    font-weight: 500;
  }

  /* Decorative elements */
  .deco-circle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Background -->
<div class="bg-gradient">
  <!-- Decorative glow circles -->
  <div class="deco-circle" style="width:200px;height:200px;top:-60px;left:-40px;background:radial-gradient(circle,rgba(99,102,241,0.06) 0%,transparent 70%);"></div>
  <div class="deco-circle" style="width:300px;height:300px;bottom:100px;right:-80px;background:radial-gradient(circle,rgba(139,92,246,0.05) 0%,transparent 70%);"></div>
</div>

<!-- Status Bar -->
<div class="status-bar">
  <span>9:41</span>
  <div class="status-icons">
    <svg width="17" height="12" viewBox="0 0 17 12" fill="white">
      <rect x="0" y="3" width="3" height="9" rx="1"/>
      <rect x="4.5" y="2" width="3" height="10" rx="1"/>
      <rect x="9" y="0" width="3" height="12" rx="1"/>
      <rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.35"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="white">
      <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35" fill="none"/>
      <rect x="2" y="2" width="17" height="8" rx="2" fill="white"/>
      <path d="M23 4.5v3c.8-.4 1.3-1 1.3-1.5s-.5-1.1-1.3-1.5z"/>
    </svg>
  </div>
</div>

<div class="login-container">
  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-circle">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div class="logo-text">
      <div class="app-title">Greek Foods</div>
      <div class="app-subtitle">Warehouse Management</div>
    </div>
  </div>

  <!-- Email field -->
  <div class="form-group">
    <label class="form-label">Имейл</label>
    <div class="form-input focused">
      <div class="input-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <span class="input-text filled">admin@greekfoods.bg</span>
    </div>
  </div>

  <!-- Password field -->
  <div class="form-group">
    <label class="form-label">Парола</label>
    <div class="form-input">
      <div class="input-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <span class="input-text">••••••••</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </div>
  </div>

  <!-- Remember + Forgot -->
  <div class="remember-row">
    <div class="remember-left">
      <div class="toggle">
        <div class="toggle-knob" style="left:auto;right:2px;background:white;"></div>
      </div>
      <span class="remember-text">Запомни ме</span>
    </div>
    <span class="forgot-link">Забравена парола?</span>
  </div>

  <!-- Login Button -->
  <div class="login-btn">Вход</div>

  <!-- Footer -->
  <div class="footer-text">
    С влизането приемате нашите<br>
    <a href="#">Условия за ползване</a> и <a href="#">Поверителност</a>
  </div>
</div>

</body>
</html>
