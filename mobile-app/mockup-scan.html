<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Scan Invoice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    background: #0a0a14;
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    color: #ffffff;
    position: relative;
  }

  /* Status Bar */
  .status-bar {
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 8px;
    font-size: 15px;
    font-weight: 600;
    position: relative;
    z-index: 10;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* Camera viewfinder */
  .camera-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 83px;
    background: #050508;
    overflow: hidden;
  }

  /* Simulated camera feed with dark scene */
  .camera-scene {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #0a0a0f 0%, #111118 40%, #0d0d14 100%);
  }

  /* Subtle noise texture */
  .camera-scene::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(ellipse 200px 100px at 30% 60%, rgba(30,30,50,0.5) 0%, transparent 100%),
      radial-gradient(ellipse 300px 200px at 70% 30%, rgba(20,20,40,0.4) 0%, transparent 100%);
  }

  /* Document hint in scene */
  .doc-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    width: 220px;
    height: 150px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .doc-lines {
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .doc-line {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
  }
  .doc-line.short { width: 60%; }
  .doc-line.medium { width: 80%; }

  /* Viewfinder overlay */
  .viewfinder {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    width: 280px;
    height: 200px;
  }

  /* Corner pieces */
  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: #6366f1;
    border-radius: 2px;
  }
  .corner.tl { top: 0; left: 0; }
  .corner.tl::before { width: 3px; height: 100%; top: 0; left: 0; }
  .corner.tl::after { width: 100%; height: 3px; top: 0; left: 0; }

  .corner.tr { top: 0; right: 0; }
  .corner.tr::before { width: 3px; height: 100%; top: 0; right: 0; }
  .corner.tr::after { width: 100%; height: 3px; top: 0; right: 0; }

  .corner.bl { bottom: 0; left: 0; }
  .corner.bl::before { width: 3px; height: 100%; bottom: 0; left: 0; }
  .corner.bl::after { width: 100%; height: 3px; bottom: 0; left: 0; }

  .corner.br { bottom: 0; right: 0; }
  .corner.br::before { width: 3px; height: 100%; bottom: 0; right: 0; }
  .corner.br::after { width: 100%; height: 3px; bottom: 0; right: 0; }

  /* Scan line animation effect (static) */
  .scan-line {
    position: absolute;
    left: 3px; right: 3px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #6366f1, #818cf8, #6366f1, transparent);
    top: 45%;
    opacity: 0.8;
    box-shadow: 0 0 8px rgba(99,102,241,0.6);
  }

  /* Overlay gradient at top and bottom */
  .overlay-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(180deg, rgba(5,5,8,0.95) 0%, transparent 100%);
  }
  .overlay-bottom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 200px;
    background: linear-gradient(0deg, rgba(5,5,8,0.98) 0%, rgba(5,5,8,0.6) 60%, transparent 100%);
  }

  /* Camera header */
  .cam-header {
    position: absolute;
    top: 54px;
    left: 0; right: 0;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
  }
  .cam-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }
  .cam-btn {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px);
  }

  /* Bottom UI */
  .bottom-ui {
    position: absolute;
    bottom: 83px;
    left: 0; right: 0;
    padding: 20px 24px 24px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .instruction-text {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    text-align: center;
    letter-spacing: -0.1px;
    line-height: 1.5;
  }

  .capture-btn {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #6366f1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 5px rgba(99,102,241,0.2), 0 0 0 10px rgba(99,102,241,0.08);
    position: relative;
  }
  .capture-btn::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
  }

  .gallery-link {
    font-size: 14px;
    color: #6366f1;
    font-weight: 500;
    letter-spacing: -0.1px;
  }

  /* Flash toggle */
  .flash-btn {
    position: absolute;
    top: 54px + 16px;
    right: 20px;
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    top: 80px;
  }

  /* Tab Bar */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 83px;
    background: rgba(18, 18, 30, 0.85);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: flex-start;
    padding-top: 10px;
    z-index: 20;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .tab-label {
    font-size: 10px;
    font-weight: 500;
    color: #4b5563;
  }
  .tab-item.active .tab-label { color: #6366f1; }
</style>
</head>
<body>

<!-- Camera background -->
<div class="camera-bg">
  <div class="camera-scene">
    <!-- Document hint -->
    <div class="doc-hint">
      <div class="doc-lines">
        <div class="doc-line short"></div>
        <div class="doc-line medium"></div>
        <div class="doc-line"></div>
        <div class="doc-line medium"></div>
        <div class="doc-line short"></div>
        <div class="doc-line"></div>
        <div class="doc-line medium"></div>
      </div>
    </div>
  </div>
  <!-- Overlays -->
  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>
  <!-- Viewfinder -->
  <div class="viewfinder">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scan-line"></div>
  </div>
</div>

<!-- Status Bar -->
<div class="status-bar" style="position:relative;z-index:10;">
  <span>9:41</span>
  <div class="status-icons">
    <svg width="17" height="12" viewBox="0 0 17 12" fill="white">
      <rect x="0" y="3" width="3" height="9" rx="1"/>
      <rect x="4.5" y="2" width="3" height="10" rx="1"/>
      <rect x="9" y="0" width="3" height="12" rx="1"/>
      <rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.35"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="white">
      <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35" fill="none"/>
      <rect x="2" y="2" width="17" height="8" rx="2" fill="white"/>
      <path d="M23 4.5v3c.8-.4 1.3-1 1.3-1.5s-.5-1.1-1.3-1.5z"/>
    </svg>
  </div>
</div>

<!-- Camera header -->
<div class="cam-header">
  <span class="cam-title">Сканирай</span>
  <div class="cam-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.36 6.64a9 9 0 110 10.72M23 3l-4.35 4.35M23 3v5h-5"/>
    </svg>
  </div>
</div>

<!-- Bottom UI -->
<div class="bottom-ui">
  <p class="instruction-text">Насочете камерата към фактурата<br>и изчакайте автоматично разпознаване</p>
  <div class="capture-btn">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </div>
  <span class="gallery-link">Избери от галерията</span>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
  <div class="tab-item">
    <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
    </div>
    <span class="tab-label">Панел</span>
  </div>
  <div class="tab-item active">
    <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>
    <span class="tab-label" style="color:#6366f1;">Сканирай</span>
  </div>
  <div class="tab-item">
    <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
        <polyline points="17 6 23 6 23 12"/>
      </svg>
    </div>
    <span class="tab-label">Продажби</span>
  </div>
  <div class="tab-item">
    <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
      </svg>
    </div>
    <span class="tab-label">Още</span>
  </div>
</div>

</body>
</html>
