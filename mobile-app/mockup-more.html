<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>More Menu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    background: #0a0a14;
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    color: #ffffff;
    position: relative;
  }

  .status-bar {
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 8px;
    font-size: 15px;
    font-weight: 600;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  .content {
    height: calc(844px - 54px - 83px);
    overflow: hidden;
    padding: 0 20px;
  }

  .page-header {
    padding: 16px 0 18px;
  }
  .page-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.6px;
  }

  /* User card */
  .user-card {
    background: linear-gradient(135deg, #1a1a2e 0%, #16162a 100%);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 18px;
    padding: 18px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .user-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }
  .avatar {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #818cf8);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(99,102,241,0.35);
  }
  .user-info { flex: 1; }
  .user-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 3px;
  }
  .user-role {
    font-size: 12px;
    color: #6b7280;
    font-weight: 500;
  }
  .user-badge {
    background: rgba(99,102,241,0.15);
    border: 1px solid rgba(99,102,241,0.25);
    color: #818cf8;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 8px;
    letter-spacing: 0.3px;
  }

  /* Menu list */
  .menu-section {
    margin-bottom: 14px;
  }
  .menu-section-title {
    font-size: 11px;
    font-weight: 600;
    color: #4b5563;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .menu-list {
    background: #12121e;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    position: relative;
  }
  .menu-item + .menu-item::before {
    content: '';
    position: absolute;
    top: 0; left: 56px; right: 0;
    height: 1px;
    background: rgba(255,255,255,0.05);
  }
  .menu-icon {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .menu-icon.green { background: rgba(34,197,94,0.15); }
  .menu-icon.indigo { background: rgba(99,102,241,0.15); }
  .menu-icon.blue { background: rgba(59,130,246,0.15); }
  .menu-icon.purple { background: rgba(139,92,246,0.15); }
  .menu-icon.amber { background: rgba(251,191,36,0.15); }

  .menu-text { flex: 1; }
  .menu-label {
    font-size: 14.5px;
    font-weight: 600;
    color: #e5e7eb;
    letter-spacing: -0.2px;
  }
  .menu-sub {
    font-size: 12px;
    color: #6b7280;
    margin-top: 1px;
  }
  .chevron {
    display: flex; align-items: center;
  }
  .badge {
    background: #ef4444;
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    margin-right: 6px;
    min-width: 22px;
    text-align: center;
  }

  /* Logout */
  .logout-btn {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .logout-text {
    font-size: 15px;
    font-weight: 600;
    color: #ef4444;
    letter-spacing: -0.2px;
  }

  /* Version */
  .version-text {
    text-align: center;
    font-size: 12px;
    color: #374151;
    font-weight: 500;
  }

  /* Tab Bar */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 83px;
    background: rgba(18, 18, 30, 0.85);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: flex-start;
    padding-top: 10px;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .tab-label {
    font-size: 10px;
    font-weight: 500;
    color: #4b5563;
  }
  .tab-item.active .tab-label { color: #6366f1; }
</style>
</head>
<body>

<!-- Status Bar -->
<div class="status-bar">

  <!-- Logout -->
