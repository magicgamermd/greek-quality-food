[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greekquality-ai-service"
version = "1.0.0"
description = "AI microservice for Greek Quality Food warehouse management"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "openai==1.30.1",
    "Pillow==10.3.0",
    "pillow-heif>=0.18.0",
    "PyPDF2==3.0.1",
    "PyMuPDF==1.24.5",
    "python-multipart==0.0.9",
    "celery==5.4.0",
    "redis==5.0.4",
    "requests==2.32.3",
    "imapclient==3.0.1",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.14.1",
    "email-validator==2.1.1",
    "python-dateutil",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "rapidfuzz>=3.0.0",
    "anyascii>=0.3.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
