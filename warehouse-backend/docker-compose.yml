version: "3.9"

# Development / local compose. For production use docker-compose.prod.yml (no exposed DB/Redis ports).
# Secrets are loaded from .env (never commit .env to git — use .env.production.example as template).

# Explicit project + volume names са КРИТИЧНИ когато имаш повече от един
# клиентски проект клониран от същия template. Без този name-директив
# docker-compose извлича project name от basename-а на папката — и тъй
# като и двата проекта имат подпапка "warehouse-backend", volume-ите
# стават със съвпадащо име и си презаписват данните. Вж. incident
# 2026-04-24 (Greek Foods DB overwrite).
name: mertm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mertm_warehouse}
      # Explicitly pin container-internal Postgres port to 5432 so the
      # host-side PGPORT value (5433 to avoid a local Postgres conflict)
      # does not leak into the container via env_file.
      PGPORT: 5432
    ports:
      # NOTE: remove this line for production (keep DB internal-only)
      # Host uses 5433 to avoid clashing with a local macOS Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-mertm_warehouse}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      # NOTE: remove this line for production (keep Redis internal-only).
      # External port 6380 избегнато от Greek Foods (6379) — иначе двата
      # проекта не могат да са пуснати паралелно дори за smoke check.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      # External port 3004 да избегне сблъсък с Greek Foods (3003).
      - "3004:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://warehouse:${POSTGRES_PASSWORD}@postgres:5432/mertm_warehouse}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8000}
    # host.docker.internal is native on Docker Desktop (Mac/Win) but needs
    # explicit mapping on Linux to reach the host's ai-service on port 8000.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist generated PDFs (invoices, receipts, documents) across rebuilds
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

volumes:
  pgdata:
    name: mertm_pgdata
  redisdata:
    name: mertm_redisdata
  uploads:
    name: mertm_uploads
