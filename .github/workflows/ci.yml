name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warehouse-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warehouse-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warehouse-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warehouse-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  ai-service:
    name: AI Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m pytest -q

  mobile-typecheck:
    name: Mobile Typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - mobile-app
          - mobile-owner-app
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: |
          if [ "${{ matrix.app }}" = "mobile-app" ]; then
            npx tsc --noEmit
          else
            npm run typecheck
          fi

  npm-audit:
    name: npm audit (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Backend audit
        working-directory: warehouse-backend
        run: npm audit --production --audit-level=high || true
      - name: Frontend audit
        working-directory: warehouse-frontend
        run: npm audit --audit-level=high || true

  pip-audit:
    name: pip-audit (ai-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        working-directory: ai-service
        run: pip-audit -r requirements.txt || true

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-backend:
    name: Trivy scan (warehouse-backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t greekfoods-backend:ci ./warehouse-backend
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: greekfoods-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

  trivy-ai-service:
    name: Trivy scan (ai-service image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ai-service image
        run: docker build -t greekfoods-ai:ci ./ai-service
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: greekfoods-ai:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
