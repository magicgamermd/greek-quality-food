<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <!-- Explicit manifest link ensures iOS / Android / desktop Chrome all
         pick it up on add-to-home-screen (vite-plugin-pwa serves the file
         at this path with devOptions.enabled=true). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover extends the page UNDER iOS's safe-area (notch,
         home bar) so our dark background reaches edge-to-edge; paired with
         env(safe-area-inset-*) padding in CSS below.
         maximum-scale=1 + user-scalable=no prevents the auto-zoom Safari
         does when focusing a <14px font input. Combined with font-size:16px
         on inputs (in index.css) this eliminates the "stuck zoomed" bug. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="МЕРТ-М мобилно PWA за анализи и приемане на входящи стоки"
    />
    <title>МЕРТ-М Склад</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
