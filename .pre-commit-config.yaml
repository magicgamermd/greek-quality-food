# Pre-commit hooks for the MERT-M warehouse platform.
#
# Install once per developer machine:
#   pip install pre-commit
#   pre-commit install
#
# Gitleaks scans staged diffs for accidentally committed secrets. The
# companion config in .gitleaks.toml whitelists .env*.example files so the
# placeholders used for documentation do not fire false positives.
repos:
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (scan for secrets)
        args:
          - "protect"
          - "--staged"
          - "--redact"
          - "--config"
          - ".gitleaks.toml"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude: ^.*\.md$
